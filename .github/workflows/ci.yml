name: verify

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every push to main publishes a release, so main runs queue and never cancel each other: the
# next run must see the tag the previous one created. Anywhere else a newer push supersedes.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The release is the native shell's AppImage, built by the same steps on every run, in
  # parallel with the other jobs; publish only runs once all of them pass.
  RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review-after
          path: artifacts/ui-review/after

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libsqlite3-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            pkg-config dbus-x11 xvfb xclip gnome-keyring \
            desktop-file-utils x11-utils python3-dbus
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  harnesses:
    # Environment-dependent proof: Secret Service, X11 clipboard, staged install, Arch layout.
    # A harness that cannot run exits 77 and is reported as UNVERIFIED, never as a pass.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The keyring, clipboard and native IPC harnesses build and run cargo test binaries.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh dbus-x11 xvfb xclip xdotool x11-utils gnome-keyring \
            desktop-file-utils minisign python3-dbus libsecret-tools libwebkit2gtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev librsvg2-dev libsqlite3-dev pkg-config
      - run: bun install --frozen-lockfile
      - name: environment directory hook
        run: python3 scripts/test-environment-hook.py
      - name: standalone AppImage installer
        run: python3 scripts/test-appimage-installer.py
      - name: keyring adapter
        run: bash scripts/test-keyring.sh || test "$?" = 77
      - name: clipboard behaviour
        run: bash scripts/test-clipboard.sh || test "$?" = 77
      - name: native backend CRUD
        run: bash scripts/test-native-ipc.sh || test "$?" = 77
      - name: packaging
        run: bash scripts/test-packaging.sh || test "$?" = 77
      - name: arch package layout
        run: bash scripts/test-arch-package.sh || test "$?" = 77

  build:
    # One release compile of the native shell per run, packed into the AppImage and started from
    # it. On main the image is also stamped with the next version and signed; everywhere else the
    # same steps run unsigned, so a packaging break is found before promotion.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Restore before the version is stamped: the cache key hashes Cargo.toml and Cargo.lock,
      # and a key that changed with every release would never hit.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Cache AppImage tooling
        uses: actions/cache@v4
        with:
          path: ~/.cache/dev-console-appimage
          key: appimage-tooling-${{ runner.os }}-${{ hashFiles('scripts/build-appimage.sh') }}
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libfontconfig1-dev minisign
      - name: Choose next release version
        id: version
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          last=$(git ls-remote --tags origin 'v0.0.*' | sed -nE 's#.*refs/tags/v0\.0\.([0-9]+)$#\1#p' | sort -n | tail -1)
          version="0.0.$(( ${last:-0} + 1 ))"
          python3 scripts/set-release-version.py "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release compile
        run: cargo build --release --locked -p dev-console-desktop
      - name: Build AppImage
        run: bash scripts/build-appimage.sh target/release/dev-console release/Dev-Console.AppImage
      - name: command-line smoke against the AppImage
        run: bash scripts/smoke-native-cli.sh release/Dev-Console.AppImage
      - name: Sign AppImage
        if: env.RELEASE == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test "$(release/Dev-Console.AppImage --appimage-extract-and-run --version)" = "$VERSION"
          cargo run --release --locked -p dev-console-release -- release/Dev-Console.AppImage "$VERSION"
          # Check the result the way install.sh will, against the key installed clients pin, so a
          # wrong signing secret stops here and not on someone's machine.
          key=$(sed -n 2p crates/dev-console-desktop/update-key.pub)
          base64 -d release/Dev-Console.AppImage.sig > "$RUNNER_TEMP/update.minisig"
          minisign -V -q -P "$key" -m release/Dev-Console.AppImage -x "$RUNNER_TEMP/update.minisig"
          sed -n 3p "$RUNNER_TEMP/update.minisig" | tr '\t' '\n' | grep -qx "version:$VERSION"
      - name: Write updater manifest
        if: env.RELEASE == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg url 'https://github.com/First-Principle-Lab/dev-console/releases/latest/download/Dev-Console.AppImage' \
            --rawfile signature release/Dev-Console.AppImage.sig \
            '{version: $version, platforms: {"linux-x86_64": {url: $url, signature: $signature}}}' \
            > release/latest.json
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: release
          path: release/
          retention-days: 3
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, harnesses, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd release
          gh release create "v$VERSION" Dev-Console.AppImage Dev-Console.AppImage.sig latest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Dev Console $VERSION" --generate-notes --latest
