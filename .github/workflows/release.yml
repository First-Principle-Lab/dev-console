name: release

on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dev-console-release
  cancel-in-progress: false

jobs:
  appimage:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libsqlite3-dev pkg-config patchelf libfuse2t64
      - name: Choose next release version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          last=$(git tag -l 'v0.0.*' | sed -nE 's/^v0\.0\.([0-9]+)$/\1/p' | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          version="0.0.$next"
          python3 scripts/set-release-version.py "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - name: Build signed AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          bunx tauri build --bundles appimage --ci
      - name: Write updater manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$appimage"
          test -s "$appimage.sig"
          cp "$appimage" Dev-Console.AppImage
          cp "$appimage.sig" Dev-Console.AppImage.sig
          jq -n \
            --arg version "$VERSION" \
            --arg url 'https://github.com/parththirwani/dev-console/releases/latest/download/Dev-Console.AppImage' \
            --rawfile signature Dev-Console.AppImage.sig \
            '{version: $version, platforms: {"linux-x86_64": {url: $url, signature: $signature}}}' \
            > latest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "v$VERSION" Dev-Console.AppImage Dev-Console.AppImage.sig latest.json \
            --target "$SHA" --title "Dev Console $VERSION" --generate-notes --latest
