name: verify

on:
  push:
    branches: [codex/overnight-mvp, main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review-after
          path: artifacts/ui-review/after

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libsqlite3-dev pkg-config dbus-x11 xvfb xclip gnome-keyring \
            desktop-file-utils x11-utils python3-dbus
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  harnesses:
    # Environment-dependent proof: Secret Service, X11 clipboard, staged install, Arch layout.
    # A harness that cannot run exits 77 and is reported as UNVERIFIED, never as a pass.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 xvfb xclip xdotool x11-utils gnome-keyring \
            secret-tool desktop-file-utils python3-dbus libsecret-tools
      - run: bun install --frozen-lockfile
      - name: keyring adapter
        run: bash scripts/test-keyring.sh || test "$?" = 77
      - name: clipboard behaviour
        run: bash scripts/test-clipboard.sh || test "$?" = 77
      - name: native backend CRUD
        run: bash scripts/test-native-ipc.sh || test "$?" = 77
      - name: packaging
        run: bash scripts/test-packaging.sh || test "$?" = 77
      - name: arch package layout
        run: bash scripts/test-arch-package.sh || test "$?" = 77

  release-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev libsqlite3-dev pkg-config \
            dbus-x11 xvfb x11-utils
      - run: bun install --frozen-lockfile
      - run: bunx tauri build --no-bundle
      - name: native smoke against the compiled binary
        run: bash scripts/smoke-native.sh src-tauri/target/release/dev-console || test "$?" = 77
