[package]
name = "dev-console"
version = "0.0.1"
description = "Local command and secret console for Linux desktops"
authors = ["parththirwani"]
edition = "2021"
rust-version = "1.90"
default-run = "dev-console"

[lib]
name = "dev_console_lib"
# Desktop-only (Linux/X11+Wayland): the mobile cdylib/staticlib shapes would triple the
# link step for no benefit, and on a small machine they are the first thing to OOM.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
age = { version = "0.12", default-features = false, features = ["armor"] }
keyring = "4"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
libc = "0.2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[dev-dependencies]
tempfile = "3"
# The `test` feature adds tauri::test (mock runtime + real invoke dispatch) so the integration
# suites can drive the production command handlers. Dev-only: the release build does not see it.
tauri = { version = "2", features = ["tray-icon", "test"] }

[profile.dev]
# Debug builds were measured at 4.1 GB of target/ with full debuginfo - on a nearly full
# disk that is the build's biggest cost and it slows linking too. Line tables keep panic
# locations and usable backtraces while dropping the heavy variable/type info.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies need no debuginfo at all for day-to-day work on this app.
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

[profile.release.package."*"]
# The app crate stays small ("s"); dependencies take the real speed: age/crypto, SQLite
# and serde are where the hot loops are, and they cost almost nothing extra to build.
opt-level = 3
