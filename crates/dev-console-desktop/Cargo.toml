[package]
name = "dev-console-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Native Rune shell for Dev Console: Library and Finder windows, tray, single instance and control-socket wakeups."
publish = false

# The plan (§1) says this crate produces the existing `dev-console` executable. The library target
# exists so `dev-console-ui-tests` can drive the same views and window specs the binary uses.
[lib]
name = "dev_console_desktop"
path = "src/lib.rs"

[[bin]]
name = "dev-console"
path = "src/main.rs"

[dependencies]
dev-console-core = { path = "../dev-console-core" }
rune = { workspace = true }
rune-kit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
time = { workspace = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
minisign-verify = "0.3.0"
base64 = "0.22.1"
semver = "1.0.28"
tempfile = { workspace = true }

[dev-dependencies]
# Signs the fixtures the updater tests verify, with the library the release signer uses.
minisign = "=0.7.3"
