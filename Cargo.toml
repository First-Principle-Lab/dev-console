# Cargo workspace for the native Rune port (docs/plans/rune-migration.md section 1).
#
# The Tauri app stays a standalone package until the cutover in plan section 4.6: it is excluded
# here so `cargo build|test --manifest-path src-tauri/Cargo.toml` keeps resolving `src-tauri` as
# its own workspace root, exactly as it did before this workspace existed.
[workspace]
resolver = "3"
members = [
    "crates/dev-console-core",
    "crates/dev-console-desktop",
    "crates/dev-console-ui-tests",
]
exclude = ["src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["parththirwani"]
repository = "https://github.com/First-Principle-Lab/dev-console"

[workspace.dependencies]
# Rune is pre-release, so both crates are pinned to one revision (plan section 1). The rev must
# match the links in docs/plans/rune-migration.md; `Cargo.lock` records the resolved commit.
rune = { git = "https://github.com/anomalyco/rune", rev = "250597b0a591881b5c0138370cbd5f405ed710db", default-features = false, features = [
    "accessibility",
    "dbus",
    "embedded-fonts",
    "native-file-dialog",
    "svg",
] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "250597b0a591881b5c0138370cbd5f405ed710db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"

# Line tables only: full debuginfo for a workspace that links a GPU renderer costs gigabytes on a
# small disk, which is the same trade `src-tauri/Cargo.toml` makes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
